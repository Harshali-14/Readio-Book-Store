{% extends 'shop/base.html' %}
{% block content %}

<style>
body {
    background: #f6f8fc;
    font-family: 'Segoe UI', sans-serif;
}

/* Wrapper */
.password-container {
    max-width: 600px;
    margin: 80px auto;
}

/* Card */
.password-card {
    background: #fff;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.password-card:hover {
    transform: translateY(-3px);
}

/* Title */
.password-title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 25px;
    color: #222;
    border-left: 4px solid #111;
    padding-left: 10px;
}

/* Label */
label {
    font-size: 14px;
    margin-bottom: 5px;
    color: #555;
}

/* Input */
.form-control {
    border-radius: 10px;
    padding: 12px;
    border: 1px solid #ddd;
    transition: 0.25s;
}

.form-control:focus {
    border-color: #111;
    box-shadow: none;
}

/* Button */
.btn-update {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #111;
    color: white;
    border: none;
    font-weight: 500;
    transition: 0.25s;
}

.btn-update:hover {
    background: #333;
    transform: translateY(-2px);
    box-shadow: 0 8px 15px rgba(0,0,0,0.15);
}

/* Back Link */
.back-link {
    display: inline-block;
    margin-top: 15px;
    font-size: 14px;
    color: #666;
    text-decoration: none;
}

.back-link:hover {
    color: #111;
}
</style>

<div class="password-container">

    <div class="password-card">

        <div class="password-title">Change Password</div>
{% if messages %}
<div class="mb-3">
    {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Current Password</label>
                <input type="password" name="current_password" class="form-control" placeholder="Enter current password">
            </div>

            <div class="mb-3">
                <label>New Password</label>
                <input type="password" name="new_password" class="form-control" placeholder="Enter new password">
            </div>

            <button class="btn-update w-100">Update Password</button>
        </form>

        <a href="{% url 'profile' %}" class="back-link">← Back to Profile</a>

    </div>

</div>

{% endblock %}
