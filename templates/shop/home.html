{% extends 'shop/base.html' %}
{% block content %}

<style>
body {
    background: #f7f9fc;
    font-family: 'Poppins', sans-serif;
}

/* HERO */
.hero {
    background: linear-gradient(135deg, #303030, #626264);
    padding: 60px 30px;
    border-radius: 20px;
    text-align: center;
    margin-bottom: 25px;
    color: white;
}

/* SEARCH */
.search-box {
    background: white;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 20px;
}

/* CATEGORY */
.category-bar {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin-bottom: 25px;
}

.category-bar a {
    padding: 8px 15px;
    background: white;
    border-radius: 20px;
    text-decoration: none;
    color: #333;
}

/* BOOK ROW */
.book-row {
    display: flex;
    gap: 20px;
    overflow-x: auto;
}

/* BOOK CARD */
.book-card {
    min-width: 220px;
}

.book-link {
    text-decoration: none;
    color: inherit;
}

/* IMAGE */
.book-img-wrapper {
    position: relative;
    overflow: hidden;
    border-radius: 15px;
}

.book-img-wrapper img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    transition: transform 0.3s;
}

.book-img-wrapper:hover img {
    transform: scale(1.1);
}

/* OVERLAY */
.overlay {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 10px;
    opacity: 0;
    transition: 0.3s;
    text-align: center;
}

.book-img-wrapper:hover .overlay {
    opacity: 1;
}

/* CHAT BUTTON */
#chatbot-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, #4e54c8, #6a11cb);
    color: white;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 26px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

/* CHATBOX */
#chatbox {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 340px;
    height: 480px;
    background: white;
    display: none;
    flex-direction: column;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    overflow: hidden;
}

/* HEADER */
.chat-header {
    background: linear-gradient(135deg, #4e54c8, #6a11cb);
    color: white;
    padding: 12px;
    display: flex;
    justify-content: space-between;
}

/* BODY */
#chat-body {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    background: #f7f9fc;
}

/* MESSAGE */
.msg {
    margin: 6px 0;
    padding: 10px;
    border-radius: 14px;
    max-width: 80%;
}

/* USER */
.user {
    background: #4e54c8;
    color: white;
    margin-left: auto;
}

/* BOT */
.bot {
    background: #e9ecef;
    margin-right: auto;
}

/* INPUT */
.chat-input {
    display: flex;
    padding: 10px;
    background: white;
}

.chat-input input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ddd;
}

.chat-input button {
    margin-left: 8px;
    background: #4e54c8;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 50%;
}
</style>

<div class="container mt-4">

    <!-- HERO -->
    <div class="hero">
        <h1>📚 Readio</h1>
        <p>Explore books like never before ✨</p>
    </div>

    <!-- SEARCH -->
    <div class="search-box">
        <form method="GET" class="row g-2">
            <div class="col-md-8">
                <input type="text" name="q" class="form-control" placeholder="🔍 Search books...">
            </div>
            <div class="col-md-2">
                <select name="category" class="form-select">
                    <option value="">All</option>
                    {% for cat in categories %}
                        <option value="{{ cat.name }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-dark w-100">Search</button>
            </div>
        </form>
    </div>

    <!-- CATEGORY -->
    <div class="category-bar">
        <a href="/">All</a>
        {% for cat in categories %}
            <a href="?category={{ cat.name }}">{{ cat.name }}</a>
        {% endfor %}
    </div>

    <!-- BOOKS -->
    <div class="book-row">
        {% for book in books %}
        <div class="book-card">
            <a href="{% url 'book_detail' book.id %}" class="book-link">

                <div class="book-img-wrapper">
                    <img src="{{ book.image.url }}">
                    <div class="overlay">
                        <h6>{{ book.title }}</h6>
                        <p>₹{{ book.price }}</p>
                    </div>
                </div>

            </a>
        </div>
        {% endfor %}
    </div>

</div>

<!-- CHAT BUTTON -->
<div id="chatbot-btn" onclick="toggleChat()">💬</div>

<!-- CHATBOX -->
<div id="chatbox">
    <div class="chat-header">
        🤖 Readio AI
        <span onclick="toggleChat()">✖</span>
    </div>

    <div id="chat-body"></div>

    <div class="chat-input">
        <input type="text" id="user-input" placeholder="Ask something...">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
function toggleChat() {
    let chatbox = document.getElementById("chatbox");
    chatbox.style.display = chatbox.style.display === "flex" ? "none" : "flex";

    if (chatbox.style.display === "flex" && document.getElementById("chat-body").innerHTML === "") {
        addMessage("bot", "👋 Hi! Ask me: Python, AI, Web, Business...");
    }
}

function addMessage(type, text) {
    let chatBody = document.getElementById("chat-body");

    let msg = document.createElement("div");
    msg.classList.add("msg", type);
    msg.innerText = text;

    chatBody.appendChild(msg);
    chatBody.scrollTop = chatBody.scrollHeight;
}

function sendMessage() {
    let input = document.getElementById("user-input");
    let message = input.value;

    if (!message) return;

    addMessage("user", message);
    input.value = "";

    fetch("/chatbot/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify({ message: message })
    })
    .then(res => res.json())
    .then(data => {
        addMessage("bot", data.reply);
    });
}

function getCookie(name) {
    let value = null;
    document.cookie.split(';').forEach(c => {
        if (c.trim().startsWith(name + '=')) {
            value = decodeURIComponent(c.split('=')[1]);
        }
    });
    return value;
}
</script>

{% endblock %}
