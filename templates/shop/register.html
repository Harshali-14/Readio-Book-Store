{% extends 'shop/base.html' %}
{% block content %}

<style>

/* ===== BODY ===== */
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f8fafc, #eef2ff);
    overflow-x: hidden;
}

/* ===== CENTER ===== */
.auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* ===== FLOATING BACKGROUND GLOW ===== */
.auth-wrapper::before,
.auth-wrapper::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(99,102,241,0.15), transparent);
    filter: blur(80px);
    z-index: 0;
}

.auth-wrapper::before {
    top: 10%;
    left: 10%;
    animation: floatGlow 8s infinite alternate;
}

.auth-wrapper::after {
    bottom: 10%;
    right: 10%;
    animation: floatGlow 10s infinite alternate;
}

@keyframes floatGlow {
    from { transform: translateY(0px); }
    to { transform: translateY(40px); }
}

/* ===== GLASS CARD ===== */
.auth-card {
    width: 430px;
    padding: 35px;
    border-radius: 18px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    position: relative;
    z-index: 1;

    /* Smooth entry */
    opacity: 0;
    transform: translateY(40px) scale(0.97);
    animation: cardEnter 0.8s ease forwards;
}

@keyframes cardEnter {
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ===== TITLE ===== */
.auth-title {
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    color: #111827;

    animation: fadeDown 0.8s ease forwards;
    opacity: 0;
}

.auth-subtitle {
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 25px;

    animation: fadeDown 0.8s ease forwards;
    animation-delay: 0.2s;
    opacity: 0;
}

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ===== INPUT BLOCK ===== */
.input-block {
    margin-bottom: 15px;
    opacity: 0;
    transform: translateY(15px);
    animation: fadeSlide 0.6s ease forwards;
}

/* stagger animation */
.input-block:nth-child(1) { animation-delay: 0.3s; }
.input-block:nth-child(2) { animation-delay: 0.4s; }
.input-block:nth-child(3) { animation-delay: 0.5s; }
.input-block:nth-child(4) { animation-delay: 0.6s; }

@keyframes fadeSlide {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.input-block label {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
    color: #374151;
}

/* ===== INPUT FIELD (FLOAT EFFECT) ===== */
.input-block input {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
    background: #fff;
}

/* Focus effect */
.input-block input:focus {
    border-color: #6366f1;
    box-shadow: 0 6px 18px rgba(99,102,241,0.15);
    transform: translateY(-1px);
}

/* ===== BUTTON ===== */
.btn-auth {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #6366f1, #3b82f6);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;

    opacity: 0;
    animation: fadeSlide 0.6s ease forwards;
    animation-delay: 0.7s;
}

/* Hover + glow */
.btn-auth:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(99,102,241,0.3);
}

/* Click */
.btn-auth:active {
    transform: scale(0.96);
}

/* ===== LINK ===== */
.auth-link {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;

    opacity: 0;
    animation: fadeSlide 0.6s ease forwards;
    animation-delay: 0.8s;
}

.auth-link a {
    color: #6366f1;
    font-weight: 600;
    text-decoration: none;
    transition: 0.2s;
}

.auth-link a:hover {
    text-decoration: underline;
}

/* ===== ALERT ===== */
.alert {
    background: #fee2e2;
    color: #991b1b;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 14px;
    animation: shake 0.4s ease;
}

/* Shake */
@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 500px) {
    .auth-card {
        width: 90%;
        padding: 25px;
    }
}

</style>

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-title">Create Account</div>
        <div class="auth-subtitle">Join our modern bookstore experience</div>

        {% for message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-block">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="input-block">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="input-block">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <div class="input-block">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required>
            </div>

            <button type="submit" class="btn-auth">Create Account</button>

        </form>

        <div class="auth-link">
            Already have an account? <a href="/login/">Login</a>
        </div>

    </div>

</div>

{% endblock %}
