{% extends 'shop/base.html' %}
{% block content %}

<style>
body {
    background: #f6f8fc;
    font-family: 'Segoe UI', sans-serif;
}

/* Wrapper */
.edit-container {
    max-width: 600px;
    margin: 80px auto;
}

/* Card */
.edit-card {
    background: #fff;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.edit-card:hover {
    transform: translateY(-3px);
}

/* Title */
.edit-title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 25px;
    color: #222;
    border-left: 4px solid #111;
    padding-left: 10px;
}

/* Input */
.form-control {
    border-radius: 10px;
    padding: 12px;
    border: 1px solid #ddd;
    transition: 0.25s;
}

.form-control:focus {
    border-color: #111;
    box-shadow: none;
}

/* Label */
label {
    font-size: 14px;
    margin-bottom: 5px;
    color: #555;
}

/* Button */
.btn-save {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #111;
    color: white;
    border: none;
    font-weight: 500;
    transition: 0.25s;
}

.btn-save:hover {
    background: #333;
    transform: translateY(-2px);
    box-shadow: 0 8px 15px rgba(0,0,0,0.15);
}

/* Back link */
.back-link {
    display: inline-block;
    margin-top: 15px;
    font-size: 14px;
    color: #666;
    text-decoration: none;
}

.back-link:hover {
    color: #111;
}
</style>

<div class="edit-container">

    <div class="edit-card">

        <div class="edit-title">Edit Profile</div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" value="{{ user.username }}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}" class="form-control">
            </div>

            <button class="btn-save w-100">Save Changes</button>
        </form>

        <a href="{% url 'profile' %}" class="back-link">← Back to Profile</a>

    </div>

</div>

{% endblock %}
